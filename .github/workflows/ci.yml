name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Test
        # test/all.test.ts runs every suite in one process: faster, and it
        # works where spawning child processes is restricted.
        run: npm test
      - name: Build
        run: npm run build
      - name: Benchmark
        run: npm run bench
      - name: Self-lint the bundled fixtures
        run: node dist/cli.js fixtures/ --format json --out report.json
        continue-on-error: true
